[project]
name = "graphql-auth-service"
version = "0.1.0"
description = "FastAPI + Strawberry GraphQL auth service with MySQL-backed auth flows"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "strawberry-graphql[fastapi]>=0.209.4",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.0",
    "python-jose>=3.3.0",
    "uvicorn[standard]>=0.30.1",
    "cryptography>=46.0.3",
    "bcrypt>=5.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
