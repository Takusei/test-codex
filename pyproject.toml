[project]
name = "graphql-auth-service"
version = "0.1.0"
description = "FastAPI + Strawberry GraphQL auth service with MySQL-backed auth flows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "strawberry-graphql[fastapi]>=0.209.4",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.0",
    "python-jose>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "uvicorn[standard]>=0.30.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true
