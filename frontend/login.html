<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatbot Login</title>
    <style>
      body { font-family: Inter, system-ui, -apple-system, sans-serif; background: #f6f8fa; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
      .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 360px; }
      h1 { margin: 0 0 16px; font-size: 24px; color: #111827; }
      label { display: block; margin-top: 12px; color: #374151; font-weight: 600; }
      input { width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
      button { margin-top: 20px; width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 700; }
      button:hover { background: #1d4ed8; }
      .notice { margin-top: 12px; color: #6b7280; font-size: 13px; }
      .error { color: #b91c1c; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sign in</h1>
      <p class="notice">Use the demo account: <strong>demo / demo-password</strong>.</p>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" value="demo" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" value="demo-password" />
      <button id="login-btn">Login</button>
      <div id="error" class="error"></div>
    </div>
    <script>
      const loginBtn = document.getElementById('login-btn');
      const errorBox = document.getElementById('error');

      loginBtn.addEventListener('click', async () => {
        errorBox.textContent = '';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) {
          errorBox.textContent = 'Please enter username and password.';
          return;
        }
        try {
          const response = await fetch('/graphql', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: 'mutation($u:String!, $p:String!){ login(username:$u, password:$p){ token message } }',
              variables: { u: username, p: password }
            })
          });
          const result = await response.json();
          if (result.errors) {
            errorBox.textContent = result.errors[0].message;
            return;
          }
          const token = result.data.login.token;
          localStorage.setItem('chatbot_token', token);
          window.location.href = '/frontend/chat.html';
        } catch (err) {
          errorBox.textContent = 'Login failed: ' + err.message;
        }
      });
    </script>
  </body>
</html>
